  When evaluating, the user instruction prompt IS available; factor in whether the video faithfully realises what the prompt asks for IN THIS DIMENSION (e.g. for 'character', whether each described persona is identifiable; for 'action', whether the described motion plays out plausibly), but do NOT score the prompt-fidelity of OTHER dimensions here.

  ## Rubric requirements
  Rubrics MUST be:
    - Observable from the supplied video clip(s) alone
    - Discriminative between the winner Vw (rank 1) and the loser Vl (rank 2)
    - Written in plain natural language; NO benchmark-specific bracket prefixes
    - Free of generic 'looks better' phrasing — be concrete
